<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Let's Raft</title> 
    <meta name="description" content="This is a website of whitewater rafting to improve my skills of software development">
    <meta name="author" content="Yeikob Valverde">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Logo rafting">
        <nav>
            <a href="./">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a class="current" href="contact.html">Contact Us</a>
        </nav>
        
    </header>
    <main>

        <section class="company-info"> 
            <h1>White Water Rafting Company</h1>

            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-content">

            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d7656.712811401842!2d-71.5488662!3d-16.355797!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91424a51ab03821b%3A0xfdee080005841034!2sCusipata%20Rafting%20Arequipa!5e0!3m2!1ses-419!2spe!4v1780784235699!5m2!1ses-419!2spe" width="450" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form>
                <label for="name">Name</label>
                <input type="name" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <div class="purpose">
                    <p>Message Purpose</p>

                    <label>
                        <input type="radio" name="purpose">
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose">
                        Website Suggestion
                    </label>
                </div>

                <label>Message</label>
                <textarea rows="5"></textarea>

                <label class="newsletter">
                    <input type="checkbox">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get In Touch!</button>

            </form>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Employee 1">
                <figcaption>John Smith - Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Employee 2">
                <figcaption>Sarah Jones - Instructor</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Employee 3">
                <figcaption>Mike Brown - Manager</figcaption>
            </figure>

        </section>

    </main>+
    <footer>
        <p>©Let's Raft 2026 | Yeikob Valverde | Perú</p> 
        <nav class="socialmedia">

            <a href="facebook">
                <img src="images/logo_fb.png" alt="Facebook icon" width="10">
            </a>
            <a href="instagram">
                <img src="images/logo_ig.png" alt="Instagram Icon" width="10">
            </a>
            <a href="twitter">
                <img src="images/logo_tw.png" alt="Twitter icon" width="10">
            </a>

        </nav>
    </footer>
</body>
</html>
